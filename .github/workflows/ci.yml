name: CI

# PRD 10.2: "Pin GitHub Actions by immutable commit SHA."
# A tag is mutable; a SHA is not. Version comments are for humans - the SHA is
# what actually runs. Dependabot updates both together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRD 10.2 least privilege: the default token gets read-only repository contents
# and nothing else. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  contracts:
    name: Contracts (schema, taxonomy, seed, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify-budgets needs history to diff against the base ref.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: PRD 4.1 pins exact versions. A lockfile change must
      # be a reviewed commit, never a side effect of CI.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # PRD 12.2 forbids `any`, disabled lint rules, and catch-and-ignore.
      # Those rules are encoded in eslint.config.js, so lint has to run in CI
      # or the prohibition is unenforced.
      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Contract tests
        run: pnpm test

      # Generated artifacts must be committed clean (PRD 12.2, rule GEN-FIELD-001).
      # If this fails, someone edited project.ts without running schema:emit.
      - name: Schema is regenerated cleanly
        run: |
          pnpm schema:emit
          git diff --exit-code content/schema/ \
            || { echo "::error::content/schema is stale. Run 'pnpm schema:emit' and commit."; exit 1; }

      - name: Taxonomy
        run: pnpm taxonomy:verify

      # PRD 11.3: the seed catalog must import through the production schema
      # with no manual transformation. --check re-derives without writing.
      - name: Seed catalog re-derives
        run: pnpm seed:verify

      - name: Seed manifests are committed clean
        run: |
          pnpm seed:import
          git diff --exit-code content/projects/ \
            || { echo "::error::content/projects is out of sync with the selection document."; exit 1; }

      # Rule BLD-DETERMINISM-001. Runs on Linux while authoring happens on
      # Windows, so this also proves .gitattributes is doing its job.
      - name: Fixtures are deterministic
        run: |
          pnpm fixtures:generate
          pnpm fixtures:verify

  governance:
    name: Governance (packets, budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PRD 12.2: no workstream edits another workstream's owned paths.
      - name: Task packet isolation
        run: pnpm packets:verify

      # PRD 12.2: budgets may not be changed to make tests pass. BASE_REF makes
      # the ADR gate active; without it the script only checks coherence.
      - name: Budget governance
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm budgets:verify

  catalog:
    name: Catalog (determinism, scale, budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PRD 5.1.3 / BLD-DETERMINISM-001. Runs on Linux while authoring happens
      # on Windows, so this also proves the build is platform-independent.
      - name: Build is deterministic
        run: pnpm catalog:verify-deterministic

      # PRD 5.1.3. Diffs the catalog against content/catalog-baseline.json and
      # fails on COR-ID-PERMANENCE-001 (a published id vanished) or
      # COR-SLUG-REDIRECT-001 (a slug moved with no redirect). Both are about
      # links that already exist in the world, so CI is the last place to catch
      # them — after a deploy they are broken for everyone holding the old URL.
      # A deliberate change is accepted by running `pnpm catalog:audit --update`
      # and committing the new baseline in the same PR.
      - name: Catalog audit
        run: pnpm catalog:audit

      # The fixture corpora are gitignored — 10,000 synthetic records would
      # dominate every diff — so each job that needs them regenerates from the
      # committed lock. Deterministic by construction, so this reproduces the
      # exact bytes the lock records.
      - name: Generate fixture corpora
        run: pnpm fixtures:generate

      # The Phase 2 exit gate: a 1,300-record build inside BUILD-FULL-1300.
      # --offline makes the enrichment stage refuse to run, so CI can never
      # reach GitHub (PRD 5.1.4).
      - name: Exit-gate build (1,300 records)
        run: pnpm catalog:build -- --fixture 1300 --dry-run

      - name: Scale soak (10,000 records)
        run: pnpm catalog:build -- --fixture 10000 --dry-run

      # Stage units, corpus rules, enrichment precedence, bitset property tests,
      # and the invalid-fixture rejection contract from PRD 5.1.6.
      - name: Catalog tests
        run: pnpm exec vitest run tests/catalog

  web:
    name: Web (static export, budgets, a11y, no-JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm --filter @atlas/web build

      # Asserts the exported HTML: one h1 per page, ordered headings,
      # landmarks, canonical URLs, link integrity, and that unlisted pages stay
      # out of the sitemap (PRD 10.1, 10.4).
      - name: Export structure
        run: pnpm exec vitest run tests/web

      # PRD 0.9: budgets are enforced in CI. Thresholds come from
      # config/budgets.v1.json - nothing here is hard-coded.
      - name: Route budgets
        run: pnpm measure:routes

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The Phase 1 exit gate itself: axe on every template in both themes,
      # keyboard journeys, and the whole site driven with JavaScript disabled.
      - name: Accessibility and no-JS end-to-end
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  runtime:
    name: Runtime budgets at 1,300 (Phase 3 exit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The corpora are gitignored and regenerated deterministically from the
      # committed lock; see the catalog job for the same step.
      - name: Generate fixture corpora
        run: pnpm fixtures:generate

      # ATLAS_FIXTURE reaches catalog:build through the web build's own
      # `prebuild` hook, and caps the two fan-out routes. Without the cap this
      # step emits 2,959 evidence pages and takes ~11 minutes for pages the
      # harness never loads. See ADR 0032.
      - name: Build the site against the 1,300-record corpus
        run: pnpm web:build
        env:
          ATLAS_FIXTURE: "1300"

      # PRD 13's Phase 3 exit gate. Thresholds come from
      # config/budgets.v1.json; PRD 12.2 forbids raising one to pass.
      - name: Runtime budgets
        run: pnpm measure:runtime

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-budget-report
          path: playwright-report/
          retention-days: 7

  hygiene:
    name: Hygiene (encoding, line endings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A UTF-8 BOM breaks JSON.parse, and CRLF breaks byte-identical builds.
      # Both are easy to introduce from a Windows editor and invisible in review.
      - name: No BOM or CRLF in tracked text files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            case "$file" in *.bin|*.png|*.jpg|*.jpeg|*.avif|*.webp|*.woff|*.woff2|*.pdf|*.ico) continue ;; esac
            [ -f "$file" ] || continue
            if head -c 3 "$file" | od -An -tx1 | tr -d ' \n' | grep -qi '^efbbbf'; then
              echo "::error file=$file::UTF-8 BOM present; it breaks JSON.parse."
              fail=1
            fi
            if grep -qU $'\r' "$file" 2>/dev/null; then
              echo "::error file=$file::CRLF line endings; see .gitattributes."
              fail=1
            fi
          done < <(git ls-files)
          exit $fail
